name: Build Current-Activity APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-activity-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and package both APK variants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for Linux scanner checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux scanner dependencies
        run: python -m pip install -r tools/linux/requirements.txt

      - name: Check Linux scanner syntax and tests
        run: |
          python -m compileall -q tools/linux
          python -m unittest discover -s tools/linux -p 'test_*.py'
          python tools/linux/apk_scanner.py --help

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile global and Play Store debug APKs
        run: ./gradlew --no-daemon --stacktrace assembleGlobalDebug assemblePlayStoreDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -lt 2 ]; then
            echo "Expected both Global and Play Store APK variants, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          printf 'APK outputs verified:\n'
          du -h "${apks[@]}"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: current-activity-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
