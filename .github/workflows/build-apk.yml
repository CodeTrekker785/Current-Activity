name: Build Current-Activity APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build global debug APK
        run: ./gradlew --no-daemon assembleGlobalDebug

      - name: Build Play Store debug APK
        run: ./gradlew --no-daemon assemblePlayStoreDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: current-activity-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
